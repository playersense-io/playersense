# PlayerSense — Stage 1 local stack (§7.1).
#
# Every published port comes from .env and none of them is a service default, so this
# stack can run beside any other local database without a collision. Change a port in
# .env and nowhere else.
#
# Run from the repository root:
#   export COMPOSE_FILE=infra/stage1/compose/docker-compose.yml
#   docker compose up -d

name: ${COMPOSE_PROJECT_NAME:-playersense}

services:
  postgres:
    image: postgres:18-alpine
    container_name: playersense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-playersense}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-playersense_local}
      POSTGRES_DB: ${PG_DATABASE:-playersense}
      # The two control-plane tiers (§99), created by the init script below. Separate
      # databases rather than separate schemas, because in production they are separate
      # servers in separate jurisdictions — the global tier is US-hosted and holds no
      # player data, a cell's tier lives in the cell's region and holds everything that
      # names a player. One container locally, two DSNs in the code.
      PG_GLOBAL_DATABASE: ${PG_GLOBAL_DATABASE:-playersense_global}
      PG_CELL_DATABASE: ${PG_CELL_DATABASE:-playersense_eu_1}
      # Deterministic collation, so ORDER BY does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    ports:
      - "127.0.0.1:${PG_PORT:-21432}:5432"
    volumes:
      # PostgreSQL 18+ wants a single mount at /var/lib/postgresql, not at
      # /var/lib/postgresql/data — the data directory then lives in a subdirectory,
      # which is what lets `pg_upgrade --link` work across a mount boundary later.
      - postgres-data:/var/lib/postgresql
      # Runs only on a fresh data directory.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-playersense} -d ${PG_DATABASE:-playersense}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.3-alpine
    container_name: playersense-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CH_USER:-playersense}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-playersense_local}
      CLICKHOUSE_DB: ${CH_DATABASE:-playersense}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # The Keeper replica path is /clickhouse/tables/{shard}/{database}/{table}, and
      # {shard} is the cell rather than a constant: two cells sharing a Keeper would
      # otherwise collide on every znode. Read by macros.xml through from_env.
      CH_SHARD: ${CELL:-eu-1}
      CH_REPLICA: ${CELL:-eu-1}-01
    ports:
      - "127.0.0.1:${CH_HTTP_PORT:-21123}:8123"
      - "127.0.0.1:${CH_NATIVE_PORT:-21900}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Embedded Keeper + macros, so ReplicatedMergeTree works on one node and §23
      # keeps the insert deduplication §21's at-least-once delivery requires.
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  valkey:
    image: valkey/valkey:9-alpine
    container_name: playersense-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-21379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  clickhouse-data:
